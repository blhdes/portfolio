<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALEJANDRO GÓMEZ</title>
  <meta name="description" content="Portrait photography by Ale Gómez.">
  <meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#181613" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- One typeface, Inter, throughout; display=swap shows text in a
       fallback font while it downloads. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=54">
</head>
<body>

  <nav class="nav">
    <a href="/" class="nav-name">ALEJANDRO GÓMEZ</a>
    <div class="nav-links">
      <a href="/photography/" aria-current="page">Photography</a>
      <a href="/apps/">Apps</a>
      <a href="/projects/">Projects</a>
      <a href="/cv/">CV</a>
    </div>
  </nav>

  <main class="archive">
    <h1 class="sr-only">Portraits</h1>

    <!-- Only one portrait so far; add more archive-item figures here as
         they're gathered, same pattern as flash-magazine/. -->
    <section class="archive-group">
      <!-- The original file is only 471px wide, so this one holds a modest
           width instead of stretching to the column and going soft. -->
      <figure class="archive-item archive-item--small">
        <img class="photo" src="/photography/pep-munne.webp"
             data-full="/photography/pep-munne-full.webp"
             alt="Pep Munn&eacute;, Spanish actor &mdash; black-and-white portrait"
             width="471" height="650">
      </figure>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; Ale G&oacute;mez, <span id="year">2026</span></p>
  </footer>

  <!-- Full-screen photo viewer. Populated and toggled by main.js. -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" type="button" aria-label="Close">&times;</button>
    <img class="lightbox-img" id="lightbox-img" alt="">
  </div>

  <script src="/js/main.js?v=54"></script>
</body>
</html>
